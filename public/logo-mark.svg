<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="翻翻词卡">
  <!--
    A card with its top-right corner turned.

    The fold is the gesture the product is named after (翻); the rounded
    rectangle is the card; lifting a corner is what "look at the other side"
    looks like. Flat colour on purpose — no gradient, no shadow, no stroke.
    See docs/LOGO_DESIGN.md.
  -->
